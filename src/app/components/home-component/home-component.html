<h1>Home</h1>
<h2>Departamentos</h2>

<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID Departamento</th>
            <th>Nombre</th>
            <th>Localidad</th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept) {
        <tr>
            <td>{{dept.numero}}</td>
            <td>{{dept.nombre}}</td>
            <td>{{dept.localidad}}</td>
        </tr>
        }
    </tbody>
</table>
