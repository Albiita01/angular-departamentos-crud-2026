<h1>Home</h1>
<h2>Departamentos</h2>

<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID Departamento</th>
            <th>Nombre</th>
            <th>Localidad</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept) {
        <tr>
            <td>{{dept.numero}}</td>
            <td>{{dept.nombre}}</td>
            <td>{{dept.localidad}}</td>
            <td>
                <!-- También se puede poner así:
                <a [routerLink]="['/details', dept.numero, dept.nombre, dept.localidad]">Detalles</a> -->
                <a [routerLink]="['/details/' + dept.numero + '/' + dept.nombre + '/' + dept.localidad]">Detalles</a>
                <a [routerLink]="['/update', dept.numero]" class="btn btn-info">Editar</a>
                <button (click)="deleteDepartamento(dept.numero)">Eliminar</button>
            </td>
        </tr>
        }
    </tbody>
</table>
